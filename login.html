
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ADEPER Nyarugunga</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101d3a, #243e68);
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            background: #d9a441;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #172b4d;
            margin-bottom: 8px;
            font-size: 25px;
        }

        h3 {
            text-align: center;
            color: #777;
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d9a441;
            box-shadow: 0 0 5px rgba(217, 164, 65, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #172b4d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d9a441;
        }

        #message {
            text-align: center;
            color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">A</div>

        <h2>ADEPER Nyarugunga</h2>
        <h3>Church Management System</h3>

        <form id="loginForm">

            <label>Username</label>
            <input type="text" id="username"
                   placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login to Dashboard</button>

        </form>

        <p id="message"></p>

        <div class="footer">
            © 2026 ADEPER Nyarugunga
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            message.textContent = '';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    message.textContent = data.message || 'Login failed';
                }

            } catch (error) {
                message.textContent = 'Unable to connect to the server.';
            }
        });
    </script>

</body>
</html>
